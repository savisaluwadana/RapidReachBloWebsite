name: Refresh MCP lockfile

on:
  push:
    branches:
      - fix/vercel-nextjs-detection
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: mcp/go.mod

      - name: Generate reproducible module lockfile
        run: go mod tidy

      - name: Verify MCP build
        run: |
          go vet ./...
          go build ./cmd/server

      - name: Commit go.mod/go.sum if changed
        working-directory: .
        run: |
          if git diff --quiet -- mcp/go.mod mcp/go.sum && git ls-files --error-unmatch mcp/go.sum >/dev/null 2>&1; then
            echo "MCP lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/go.mod mcp/go.sum
          git commit -m "fix: commit MCP module checksums"
          git push origin HEAD:${{ github.ref_name }}
