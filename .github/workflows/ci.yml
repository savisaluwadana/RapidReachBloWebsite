name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Engineering Intelligence product surfaces
        run: |
          npx eslint \
            app/intelligence \
            app/graph \
            app/skills \
            app/labs \
            app/stack \
            app/evaluations \
            app/teams \
            app/mcp \
            components/IntelligenceFeed.tsx \
            components/SkillsGraph.tsx \
            components/IncidentSimulator.tsx \
            components/StackImpactExplorer.tsx \
            components/ManifestReviewLab.tsx \
            components/AgentEvaluationHarness.tsx \
            components/Navbar.tsx \
            components/Footer.tsx \
            components/CommandPalette.tsx \
            lib/rapidreach/product-data.ts

      - name: Build complete web application
        run: npm run build

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: mcp/go.mod

      - name: Resolve module graph
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build MCP server
        run: go build ./cmd/server
